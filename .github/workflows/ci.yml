name: CI

on:
  push:
    branches: [ "main", "framework-improvements" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:

    runs-on: windows-latest

    steps:
      - name: Enable long paths
        run: git config --system core.longpaths true

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4

      - name: Display .NET version
        run: dotnet --version

      - name: Set VERSION variable from tag
        run: echo "VERSION=0.0.0" | Out-File -FilePath $env:GITHUB_ENV

      - name: Download References
        shell: pwsh
        run: |
          .\Download-References.ps1

      - name: Build DLLs - Oxide
        run: dotnet build Rust.UIFramework.csproj -c Release /p:Platform=UiFramework /p:Version=${{ env.VERSION }} -f net48
        working-directory: src/Rust.UIFramework

      - name: Build Unit Tests
        run: dotnet build src/ -c Release /p:Platform="Unit Tests"

      - name: Run Unit Tests
        run: |
            .\src\Rust.UiFramework.UnitTests\bin\"Unit Tests"\Release\net9.0\Rust.UiFramework.UnitTests.exe
